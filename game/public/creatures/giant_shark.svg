  <path d="M20 16 C18 20 18 30 20 34" fill="none" stroke="#040e2a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24 14 C22 18 22 30 24 36" fill="none" stroke="#040e2a" stroke-width="1.5" stroke-linecap="round"/>
