  <ellipse cx="4" cy="26" rx="1.5" ry="1" fill="#040e2a"/>
  <!-- 눈 (검고 날카로운) -->
  <circle cx="10" cy="18" r="4.5" fill="#040e2a" stroke="#0a1a44" stroke-width="1.5"/>
  <circle cx="10" cy="18" r="2" fill="#0a0a1a"/>
  <circle cx="9" cy="17" r="1" fill="white" opacity="0.6"/>
  <!-- 입 (크게 벌린, 이빨 가득) -->
