  <line x1="6" y1="30" x2="5" y2="35" stroke="white" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="8" y2="37" stroke="white" stroke-width="1.5"/>
  <line x1="10" y1="33" x2="10" y2="38" stroke="white" stroke-width="1.5"/>
  <line x1="12" y1="34" x2="12" y2="38" stroke="white" stroke-width="1.5"/>
  <line x1="14" y1="34" x2="14" y2="38" stroke="white" stroke-width="1.5"/>
  <!-- 보스 표시 - 빛나는 눈 -->
  <circle cx="10" cy="18" r="5.5" fill="none" stroke="#4488ff" stroke-width="1" opacity="0.6"/>
  <!-- 상처 흉터 -->
  <line x1="24" y1="18" x2="28" y2="24" stroke="#0a1a44" stroke-width="1.2" opacity="0.5"/>
  <line x1="26" y1="17" x2="30" y2="23" stroke="#0a1a44" stroke-width="1" opacity="0.3"/>
