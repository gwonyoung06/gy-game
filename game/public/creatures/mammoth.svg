  <rect x="50" y="48" width="8" height="14" rx="4" fill="#6633aa" stroke="#3a1a66" stroke-width="1.8"/>
  <!-- 꼬리 (짧고 뭉툭) -->
  <path d="M58 38 C62 36 62 42 58 42" fill="none" stroke="#7744bb" stroke-width="3" stroke-linecap="round"/>
