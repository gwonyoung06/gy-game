<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 몸통 (통통하고 둥글게) -->
  <ellipse cx="32" cy="38" rx="18" ry="16" fill="#7a5a3c" stroke="#3a2a10" stroke-width="2"/>
